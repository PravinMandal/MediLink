<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MediLink emergency mark">
  <!-- Emergency card mark: a connected, traceable record path under a
       reserved emergency cross. High-contrast, print-safe, no gradients:
       the printed emergency card is black on white paper. -->
  <rect width="128" height="128" rx="20" fill="#FFFFFF"/>

  <!-- Hexagonal record seal, solid ink outline -->
  <path d="M64 18 105 41.5v47L64 112 23 88.5v-47Z"
        fill="none" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>

  <!-- M path + interlocking link -->
  <g stroke="#111111" stroke-width="7" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M44 88V56l20 20"/>
    <path d="M84 88V56L64 76"/>
    <rect x="56" y="64" width="16" height="16" rx="5" stroke-width="5"/>
  </g>

  <!-- baseline record line -->
  <path d="M44 96h40" stroke="#111111" stroke-width="4" stroke-linecap="round"/>

  <!-- Reserved emergency cross, top right -->
  <g fill="#B3261E">
    <path d="M96 24h8v8h8v8h-8v8h-8v-8h-8v-8h8z"/>
  </g>
</svg>
