<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 220" role="img" aria-label="MediLink wordmark">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D9FFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4D9FFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="220" fill="none"/>

  <!-- Mark (small) -->
  <g transform="translate(28,42) scale(0.32)">
    <path d="M256 64 415 156v200L256 448 97 356V156Z"
          fill="rgba(77,159,255,0.06)" stroke="url(#edge)" stroke-width="10" stroke-linejoin="round"/>
    <g stroke="#4D9FFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M168 330V210l56 62"/>
      <path d="M344 330V210l-56 62"/>
      <rect x="226" y="238" width="60" height="60" rx="18" stroke-width="12"/>
    </g>
    <path d="M168 356h176" stroke="#4D9FFF" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="152" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif"
