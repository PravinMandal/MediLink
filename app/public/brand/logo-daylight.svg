<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MediLink seal (Daylight)">
  <defs>
    <linearGradient id="edge-d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6FE0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1E6FE0" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Daylight background: opaque light paper -->
  <rect width="512" height="512" rx="96" fill="#F5F7F5"/>

  <!-- Hexagonal seal -->
  <path d="M256 64 415 156v200L256 448 97 356V156Z"
        fill="rgba(30,111,224,0.05)"
        stroke="url(#edge-d)" stroke-width="10" stroke-linejoin="round"/>

  <!-- M formed by two strokes meeting at center with an interlocking link -->
  <g stroke="#1E6FE0" stroke-width="18"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M166 340V190l90 90"/>
    <path d="M346 340V190l-90 90"/>
    <rect x="238" y="230" width="36" height="36" rx="12" stroke-width="12"/>
  </g>

  <!-- baseline: the record line beneath -->
  <path d="M168 356h176" stroke="#1E6FE0" stroke-width="8"
        stroke-linecap="round" opacity="0.5"/>
</svg>
